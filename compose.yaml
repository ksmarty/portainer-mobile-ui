services:
  portainer-mobile:
    build: .
    image: portainer-mobile:latest
    container_name: portainer-mobile
    # Direct access on :8080 (optional). Remove if Traefik is the only ingress.
    ports:
      - "8080:80"
    environment:
      # Same-origin proxy: the container's nginx forwards /api/* to Portainer
      # server-side, so the browser never calls a different origin (no CORS).
      # Set this to your Portainer URL, then in the app connect with THIS
      # app's own URL (pm.notato.xyz), not the Portainer URL.
      PORTAINER_URL: "https://portainer.notato.xyz"
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer-mobile.rule=Host(`pm.notato.xyz`)
      - traefik.http.routers.portainer-mobile.entrypoints=websecure
      - traefik.http.routers.portainer-mobile.tls.certresolver=letsencrypt
      - traefik.http.services.portainer-mobile.loadbalancer.server.port=80
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
