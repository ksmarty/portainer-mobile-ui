# Deploys the published image from GitHub Container Registry — no local build.
#
# The image is built and pushed by the Release workflow (Actions -> Release ->
# Run workflow), so it must exist on ghcr.io first.
#
# Usage:
#   docker compose -f compose.ghcr.yaml up -d
#
# Adjust: PORTAINER_URL, the Traefik host rule (pm.notato.xyz), the cert
# resolver name, and the external network to match your setup.
services:
  portainer-mobile:
    image: ghcr.io/ksmarty/portainer-mobile-ui:latest
    container_name: portainer-mobile
    # Direct access on :8080 (optional). Remove if Traefik is the only ingress.
    ports:
      - "8080:80"
    environment:
      # Same-origin proxy: the container's nginx forwards /api/* to Portainer
      # server-side, so the browser never calls a different origin (no CORS).
      # Then in the app, connect with THIS app's own URL, not the Portainer URL.
      PORTAINER_URL: "https://portainer.notato.xyz"
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer-mobile.rule=Host(`pm.notato.xyz`)
      - traefik.http.routers.portainer-mobile.entrypoints=websecure
      - traefik.http.routers.portainer-mobile.tls.certresolver=letsencrypt
      - traefik.http.services.portainer-mobile.loadbalancer.server.port=80
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
