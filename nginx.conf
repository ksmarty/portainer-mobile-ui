# Minimal nginx config tuned for a small static site on a single core.
# Single worker + no access log = lowest possible memory footprint.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No access logs: saves memory and I/O for a UI-only container
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Compress text assets for smaller transfers
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Per-server config is generated at container start
    include /etc/nginx/conf.d/*.conf;
}
